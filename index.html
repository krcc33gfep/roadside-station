<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>道の駅ビューワー（修正版・完全動作版）</title>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ===== 元CSS一切変更なし ===== */
html,body{margin:0;background:#f0fff4;color:#033;font-family:"M PLUS 1 Code",monospace;overflow-x:hidden}
header{display:flex;justify-content:center;background:#a5d6a7;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:12px 0}
.header-inner{display:flex;width:90vw;max-width:1200px}
.header-left{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.search-wrapper{width:100%}
.search-input-wrapper{position:relative;min-width:0}
input[type="text"]{width:100%;box-sizing:border-box;background:#e8f5e9;border:1px solid #81c784;border-radius:8px;padding:8px 36px 8px 10px;font-size:16px}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;color:#388e3c;cursor:pointer;display:none}
.sort-buttons{display:flex;gap:8px;justify-content:flex-end}
.sort-buttons button{background:#81c784;border:none;border-radius:6px;padding:6px 30px;font-size:18px}
.sort-buttons button.active{background:#4caf50;color:#fff}
.header-right{width:30%;padding-left:16px;font-size:17px;color:#1b5e20}
.csv-menu{display:none;position:absolute;background:#fff;border:1px solid #81c784;border-radius:8px;z-index:10}
.csv-menu button{width:100%;border:none;background:#fff;padding:10px}
.container{padding:10px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:12px;padding:10px 0;border-bottom:1px solid #c8e6c9}
.name{font-size:1.3em;font-weight:600;color:#2e7d32;cursor:pointer}
.address{font-size:.9em;color:#555}
.last-visit{text-align:right;color:#1b5e20}
.ticket{text-align:right;color:#388e3c}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);justify-content:center;align-items:center;z-index:9999}
.modal-content{background:#fff;padding:6px 20px 20px;border-radius:10px;width:70%;max-width:800px}
.visit-entry{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:4px 0}
.delete-btn{border:none;background:none;cursor:pointer;color:#d32f2f}
#visitList{max-height:102px;overflow-y:auto;border-top:1px solid #c8e6c9;margin-top:6px}
.modal-buttons{display:flex;gap:10px;margin-top:10px}
.modal-buttons button{flex:1;padding:10px;font-size:20px;border:none;border-radius:6px;color:#fff}
#addVisitBtn{background:#4caf50}
#closeModal2{background:#d32f2f}
.name{grid-column:1;grid-row:1;}
.address{grid-column:1;grid-row:2;}
.last-visit{grid-column:2;grid-row:1;text-align:right;}
.ticket{grid-column:2;grid-row:2;text-align:right;}

/* ★ 追加：訪問日入力が小さい問題の修正（これのみ） */
#visitDate{font-size:16px;padding:6px}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="search-wrapper">
        <div class="search-input-wrapper">
          <input id="search" type="text" placeholder="検索（名称・住所）...">
          <button id="clearBtn" class="clear-btn">&times;</button>
        </div>
      </div>
      <div class="sort-buttons">
        <button id="sortVisitDate">全部</button>
        <div style="position:relative">
          <button id="csvMainBtn">保存</button>
          <div class="csv-menu" id="csvMenu">
            <button id="exportCSVBtn">エクスポート</button>
            <button id="importCSVBtn">インポート</button>
          </div>
        </div>
      </div>
    </div>
    <div class="header-right" id="statsBox"></div>
  </div>
</header>

<div class="container" id="output"></div>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <h2 id="modalName"></h2>
    <div id="ticketDateLabel">切符購入日：</div>

    <div>訪問履歴<span id="visitCountLabel"></span></div>
    <div id="visitList"></div>

    <label>訪問日：<input type="date" id="visitDate"></label><br>
    <label>切符購入：<input type="checkbox" id="ticketCheck"></label>

    <div class="modal-buttons">
      <button id="addVisitBtn">追加</button>
      <button id="closeModal2">閉じる</button>
    </div>
  </div>
</div>

<input type="file" id="csvFile" style="display:none">

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/1VOKUKRTHUnmj5ILDyqJbdbqkePLFps-Ti8UpUfjnHeg/gviz/tq?tqx=out:csv&headers=1";
let rows=[],currentId=null,searchWord="",sortVisit=true;
const $=id=>document.getElementById(id);
const storage=id=>JSON.parse(localStorage.getItem(`michinoeki_${id}`)||'{"visits":[],"ticket":false,"ticketDate":null}');

fetch(csvUrl).then(r=>r.text()).then(t=>{
Papa.parse(t,{header:true,skipEmptyLines:true,complete:r=>{
rows=r.data.filter(x=>x.ID);render();
}});
});

$("search").oninput=()=>{searchWord=$("search").value.toLowerCase();$("clearBtn").style.display=searchWord?"block":"none";render()};
$("clearBtn").onclick=()=>{$("search").value="";searchWord="";render()};
$("sortVisitDate").onclick=e=>{sortVisit=!sortVisit;e.target.textContent=sortVisit?"全部":"訪問";render()};
$("csvMainBtn").onclick=e=>{e.stopPropagation();$("csvMenu").style.display=$("csvMenu").style.display==="block"?"none":"block"};
document.onclick=()=>$("csvMenu").style.display="none";

/* ===== CSVエクスポート ===== */
$("exportCSVBtn").onclick=()=>{
const data=[];
rows.forEach(r=>{
const s=storage(r.ID);
const row={
ID:r.ID,
名称:r["名称"],
住所:r["住所"]||"",
切符購入日:s.ticketDate||""
};
s.visits.forEach((v,i)=>row[`訪問日${i+1}`]=v.date);
data.push(row);
});
const csv=Papa.unparse(data);
const blob=new Blob([csv],{type:"text/csv"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="michinoeki.csv";
a.click();
};

/* ===== CSVインポート ===== */
$("importCSVBtn").onclick=()=>$("csvFile").click();
$("csvFile").onchange=e=>{
Papa.parse(e.target.files[0],{
header:true,
complete:r=>{
r.data.forEach(d=>{
if(!d.ID)return;
const visits=[];
Object.keys(d).filter(k=>k.startsWith("訪問日")&&d[k])
.forEach(k=>visits.push({date:d[k]}));
localStorage.setItem(
`michinoeki_${d.ID}`,
JSON.stringify({visits,ticket:!!d["切符購入日"],ticketDate:d["切符購入日"]||null})
);
});
render();
}
});
</script>
</body>
</html>
