<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no,address=no,email=no">
<title>道の駅ビューワー（修正版・完全動作版）</title>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body{
  margin:0;
  background:#f0fff4;
  color:#033;
  font-family:"M PLUS 1 Code",monospace;
  overflow-x:hidden;
}
/* ===== ヘッダー全体 ===== */
header{
  display:flex;
  justify-content:center;
  background:#a5d6a7;
  box-shadow:0 2px 4px rgba(0,0,0,.1);
  padding:12px 0;
}
.header-inner{
  display:flex;
  width:90vw;
  max-width:1200px;
  box-sizing:border-box;
}
/* ===== 左カラム ===== */
.header-left{
  width:70%;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
}
/* 検索 */
.search-wrapper{
  width:100%;
  display:flex;
  align-items:center;
  box-sizing:border-box;
  min-width:0;
}
.search-input-wrapper{
  position:relative;
  width:100%;
}
input[type="text"]{
  width:100%;
  background:#e8f5e9;
  border:1px solid #81c784;
  border-radius:8px;
  padding:8px 36px 8px 10px;
  font-size:16px;
  box-sizing:border-box;
}
.clear-btn{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  font-size:20px;
  color:#388e3c;
  cursor:pointer;
  display:none;
}
/* ソート・保存 */
.sort-buttons{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
.sort-buttons button{
  background:#81c784;
  border:none;
  border-radius:6px;
  padding:6px 30px;
  font-size:18px;
  cursor:pointer;
}
.sort-buttons button.active{
  background:#4caf50;
  color:#fff;
}
/* ===== 右カラム ===== */
.header-right{
  width:30%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  font-size:17px;
  color:#1b5e20;
  line-height:1.4;
  padding-left:16px;
  box-sizing:border-box;
}
/* ===== CSVメニュー ===== */
.csv-menu{
  display:none;
  position:absolute;
  background:#fff;
  border:1px solid #81c784;
  border-radius:8px;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
  z-index:10;
}
.csv-menu button{
  width:100%;
  border:none;
  background:#fff;
  padding:10px;
  cursor:pointer;
}
.csv-menu button:hover{background:#c8e6c9}
/* ===== 一覧 ===== */
.container{
  padding:10px;
  margin-top:10px;
}
.row{
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:auto auto;
  column-gap:12px;
  padding:10px 0;
  border-bottom:1px solid #c8e6c9;
  align-items:end;
}
.name{
  grid-column:1;
  grid-row:1;
  font-size:1.3em;
  font-weight:600;
  color:#2e7d32;
  cursor:pointer;
}
.address{
  grid-column:1;
  grid-row:2;
  font-size:.9em;
  color:#555;
}
.last-visit{
  grid-column:2;
  grid-row:1;
  font-size:.9em;
  color:#1b5e20;
  text-align:right;
}
.ticket{
  grid-column:2;
  grid-row:2;
  font-size:.85em;
  color:#388e3c;
  text-align:right;
}
/* ===== modal ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.modal-content{
  background:#fff;
  padding:6px 20px 20px;
  border-radius:10px;
  width:70%;
  max-width:800px;
  max-height:90%;
  overflow-y:auto;
}
.visit-entry{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:4px 0;
}
.delete-btn{
  border:none;
  background:none;
  cursor:pointer;
  color:#d32f2f;
}
#visitList{
  max-height:calc(3 * 34px);
  overflow-y:auto;
  border-top:1px solid #c8e6c9;
  margin-top:6px;
}
.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.modal-buttons button{
  flex:1;
  padding:10px;
  font-size:20px;
  border:none;
  border-radius:6px;
  color:#fff;
}
#visitDate{
  background:#e8f5e9;
  border:1px solid #81c784;
  border-radius:6px;
  padding:2px;
  font-size:20px;
  width:160px;
}
#modalName{color:#2e7d32}
#addVisitBtn{background:#4caf50}
#closeModal2{background:#d32f2f}
  .ticket-save-btn{
  background:#81c784;
  border:none;
  border-radius:6px;
  padding:3px 12px;
  font-size:16px;
  cursor:pointer;
}
#ticketDate{
  background:#e8f5e9;
  border:1px solid #81c784;
  border-radius:6px;
  padding:2px;
  font-size:18px;
  width:160px;
}
#ticketDateBox{
  margin-top:6px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="search-wrapper">
        <div class="search-input-wrapper">
          <input id="search" type="text" placeholder="検索（名称・住所）...">
          <button id="clearBtn" class="clear-btn">&times;</button>
        </div>
      </div>

      <div class="sort-buttons">
        <button id="sortVisitDate">全部</button>
        <div style="position:relative">
          <button id="csvMainBtn">保存</button>
          <div class="csv-menu" id="csvMenu">
            <button id="exportCSVBtn">エクスポート</button>
            <button id="importCSVBtn">インポート</button>
          </div>
        </div>
      </div>
    </div>

    <div class="header-right" id="statsBox">
      結果：0<br>
      訪問：0<br>
      切符：0
    </div>
  </div>
</header>

<div class="container" id="output"></div>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <h2 id="modalName"></h2>
<div>
  切符購入：
  <input type="checkbox" id="ticketCheck">
  <button id="ticketSaveBtn" class="ticket-save-btn" style="display:none;">保存</button>
</div>

<div id="ticketDateBox" style="display:none;">
  購入日：
  <input type="date" id="ticketDate">
</div>
    <div>訪問履歴<span id="visitCountLabel"></span></div>
    <div id="visitList"></div>
    <label>訪問日：<input type="date" id="visitDate"></label>
    <div class="modal-buttons">
      <button id="addVisitBtn">追加</button>
      <button id="closeModal2">閉じる</button>
    </div>
  </div>
</div>

<input type="file" id="csvFile" style="display:none">

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/1VOKUKRTHUnmj5ILDyqJbdbqkePLFps-Ti8UpUfjnHeg/gviz/tq?tqx=out:csv&headers=1";
let rows=[],currentId=null,searchWord="",sortVisit=true;

const $=id=>document.getElementById(id);
const storage=id=>{
  const data=JSON.parse(localStorage.getItem(`michinoeki_${id}`)||'{"visits":[],"ticket":false}');

  // 旧形式 true/false 互換
  if(typeof data.ticket === "boolean"){
    data.ticket = data.ticket ? "unknown" : "";
  }

  return data;
};
fetch(csvUrl).then(r=>r.text()).then(t=>{
  Papa.parse(t,{
    header:true,
    skipEmptyLines:true,
    transformHeader:h=>h.trim().replace(/^\ufeff/,""),
    complete:r=>{
      rows = r.data
        .filter(row => Object.values(row).some(v => v !== ""))
        .map(row=>{
          if(!row.ID){
            const firstKey = Object.keys(row)[0];
            row.ID = row[firstKey];
          }
          return row;
        })
        .filter(r=>r.ID != null && r.ID !== "");
      $("sortVisitDate").classList.remove("active");
      $("sortVisitDate").textContent="全部";
      render();
    }
  });
});

$("search").oninput=()=>{
  searchWord=$("search").value.toLowerCase().trim();
  $("clearBtn").style.display=searchWord?"block":"none";
  render();
};
$("clearBtn").onclick=()=>{searchWord="";$("search").value="";render()};

$("sortVisitDate").onclick=e=>{
  sortVisit=!sortVisit;
  if(sortVisit){
    e.target.classList.remove("active");
    e.target.textContent="全部";
  }else{
    e.target.classList.add("active");
    e.target.textContent="訪問";
  }
  render();
};

$("csvMainBtn").onclick=e=>{
  e.stopPropagation();
  $("csvMenu").style.display=$("csvMenu").style.display==="block"?"none":"block";
};
document.onclick=()=>{$("csvMenu").style.display="none"};

function render(){
  let list=rows.filter(r=>{
    const hit =
      !searchWord || searchWord.split(/\s+/).some(w =>
        (r["名称"]||"").toLowerCase().includes(w) ||
        (r["住所"]||"").toLowerCase().includes(w)
      );
    if(!hit)return false;
    if(sortVisit){
      const s=storage(r.ID);
      return s.visits.length>0;
    }
    return true;
  });

  if(sortVisit){
    list.sort((a,b)=>
      new Date(storage(b.ID).visits[0]?.date||0) -
      new Date(storage(a.ID).visits[0]?.date||0)
    );
  }

  $("output").innerHTML="";
  let visitCount=0,ticketCount=0;

  list.forEach(r=>{
    const s=storage(r.ID);
    if(s.visits.length>0)visitCount++;
    if(s.ticket)ticketCount++;
    const d=document.createElement("div");
    d.className="row";
    d.innerHTML=`
      <div class="name">${r["名称"]}</div>
      <div class="address">${r["住所"]||""}</div>
      <div class="last-visit">
        ${s.visits.length?`${s.visits.length}回 ${s.visits[0].date}`:""}
      </div>
      <div class="ticket">${s.ticket ? "切符購入済" : ""}</div>
    `;
    d.querySelector(".name").onclick=()=>openModal(r);
    $("output").appendChild(d);
  });

  $("statsBox").innerHTML=
    `結果：${list.length}<br>`+
    `訪問：${visitCount}<br>`+
    `切符：${ticketCount}`;
}

const modal=$("detailModal");
$("closeModal2").onclick=()=>modal.style.display="none";

function openModal(r){
  currentId=r.ID;
  modal.style.display="flex";
  $("modalName").textContent=r["名称"];
  $("visitDate").value=new Date().toISOString().split("T")[0];
  const s=storage(currentId);
$("ticketCheck").checked=!!s.ticket;

if(s.ticket && typeof s.ticket === "string"){
  $("ticketDate").value=s.ticket;
  $("ticketDateBox").style.display="block";
  $("ticketSaveBtn").style.display="none";
}else{
  $("ticketDateBox").style.display="none";
  $("ticketSaveBtn").style.display="none";
}

renderVisits(s.visits);
}

$("ticketCheck").onchange=e=>{
  if(e.target.checked){
    $("ticketDate").value=new Date().toISOString().split("T")[0];
    $("ticketDateBox").style.display="block";
    $("ticketSaveBtn").style.display="inline-block";
}else{
  if(!confirm("切符購入記録を削除しますか？")){
    e.target.checked=true;
    return;
  }

  const s=storage(currentId);
  s.ticket="";
  localStorage.setItem(
    `michinoeki_${currentId}`,
    JSON.stringify(s)
  );

  $("ticketDateBox").style.display="none";
  $("ticketSaveBtn").style.display="none";
  render();
}

};

$("ticketSaveBtn").onclick=()=>{
  const d=$("ticketDate").value;
  if(!d)return alert("購入日を入力してください");

  const s=storage(currentId);
  s.ticket=d;

  localStorage.setItem(
    `michinoeki_${currentId}`,
    JSON.stringify(s)
  );

  render();
};
  
$("addVisitBtn").onclick=()=>{
  const d=$("visitDate").value;
  if(!d)return alert("訪問日を入力してください");
  const s=storage(currentId);
  s.visits.unshift({date:d});
  localStorage.setItem(`michinoeki_${currentId}`,JSON.stringify(s));
  renderVisits(s.visits);
  render();
};

function renderVisits(v){
  $("visitList").innerHTML="";
  $("visitCountLabel").textContent=`：${v.length}回`;
  v.forEach((e,i)=>{
    const div=document.createElement("div");
    div.className="visit-entry";
    div.innerHTML=`<div>${e.date}</div>`;
    const b=document.createElement("button");
    b.textContent="🗑";
    b.className="delete-btn";
    b.onclick=()=>{
      v.splice(i,1);
      localStorage.setItem(
        `michinoeki_${currentId}`,
        JSON.stringify({ticket:$("ticketCheck").checked,visits:v})
      );
      renderVisits(v);
      render();
    };
    div.appendChild(b);
    $("visitList").appendChild(div);
  });
}

// ===== エクスポート =====
$("exportCSVBtn").onclick=()=>{
  const records=[];
  let maxVisits=0;
  for(let k in localStorage){
    if(k.startsWith("michinoeki_")){
      const s=JSON.parse(localStorage[k]);
      maxVisits=Math.max(maxVisits,s.visits.length);
    }
  }
  for(let k in localStorage){
    if(!k.startsWith("michinoeki_"))continue;
    const id=k.replace("michinoeki_","");
    const s=JSON.parse(localStorage[k]);
    const row={
  ID:id,
  ticket:s.ticket||""
};
    s.visits.forEach((v,i)=>row[`visit_${i+1}`]=v.date);
    for(let i=s.visits.length;i<maxVisits;i++)row[`visit_${i+1}`]="";
    records.push(row);
  }
  const csv=Papa.unparse(records);
  const now=new Date();
  const ts=
    now.getFullYear()+
    String(now.getMonth()+1).padStart(2,"0")+
    String(now.getDate()).padStart(2,"0")+
    String(now.getHours()).padStart(2,"0")+
    String(now.getMinutes()).padStart(2,"0");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`michinoeki_data_${ts}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

// ===== インポート =====
$("importCSVBtn").onclick=()=>{$("csvFile").click()};
$("csvFile").onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;

  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete:r=>{
      r.data.forEach(row=>{
        if(!row.ID)return;

        const visits=[];
        Object.keys(row).forEach(k=>{
          if(k.startsWith("visit_") && row[k]){
            visits.push({date:row[k]});
          }
        });

let ticket="";

if(row.ticket==="1"){
  ticket="不明";
}else if(row.ticket){
  ticket=row.ticket;
}

localStorage.setItem(
  `michinoeki_${row.ID}`,
  JSON.stringify({
    ticket,
    visits
  })
);
        
      });

      render();
      alert("インポート完了");
    }
  });

  e.target.value="";
};</script>

</body>
</html>
